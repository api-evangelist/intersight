aid: intersight
name: Cisco Intersight
description: Cisco Intersight is Cisco's SaaS operations platform for UCS servers, HyperFlex, Nexus fabrics and
  third-party infrastructure, covering provisioning, firmware lifecycle, workload optimization and Kubernetes service
  delivery. Its REST API is large and OpenAPI-generated — Cisco ships generated Python, Go, PowerShell and Terraform
  clients from it — but the source document is not served anonymously. intersight.com answers HTTP 200 with an identical
  3,784-byte single-page-application shell for every path, including invented control paths, so no spec URL on that
  host can be confirmed by a machine.
