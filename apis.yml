aid: intersight
name: Cisco Intersight
description: 'Cisco Intersight is Cisco''s SaaS operations platform for UCS servers, HyperFlex clusters, Nexus fabrics,
  third-party storage and virtualization, covering provisioning, firmware lifecycle, workload optimization, telemetry
  and Kubernetes service delivery. Cisco publishes the full OpenAPI 3.0.2 contract for the platform anonymously
  — 3,963 operations across 2,448 paths and 5,612 schemas, split into twelve per-service documents plus a combined
  document, served from cdn.intersight.com and refreshed on every production release. Every operation carries a
  summary, a tag and a unique operationId. The API uses OData-style query semantics ($filter, $top, $skip, $select,
  $expand, $apply), HTTP-signature or OAuth2 authorization-code authentication with 54 role scopes, RFC 7240 Prefer:
  respond-async for long-running work, and conditional requests (If-Match / If-None-Match) for lost-update protection.'
url: https://raw.githubusercontent.com/api-evangelist/intersight/refs/heads/main/apis.yml
type: Index
access: 3rd-Party
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: false
  label: Hosted service · you call their endpoint
