x-contract-status: real
x-contract-note: Cisco publishes the full Intersight OpenAPI 3.0.2 anonymously from cdn.intersight.com — a 27.5MB
  master document, 3,963 operations / 2,448 paths / 5,612 schemas, plus 11 per-service documents covering 100% of
  its paths. SHA-256 reconfirmed 2026-08-19. Note intersight.com itself remains a soft-404 farm; the contract lives
  on the CDN, not the app host.
