idempotency:
  supported: true
  mechanism: conditional-requests
  idempotency_key_header: null
  headers:
  - If-Match
  - If-None-Match
  failure_status: 412
  concurrency_token: the resource ModTime property, echoed as the entity tag
  scope:
    if_match_operations: 1272
    if_none_match_operations: 344
  note: 'Intersight does NOT ship an Idempotency-Key header. It ships the RFC 9110 conditional-request form instead,
    and it is declared in the contract rather than only in prose. If-None-Match: * makes a create safe to retry
    — a duplicate create is refused with 412 Precondition Failed instead of producing a second resource. If-Match:
    <ModTime> makes an update safe to retry by refusing a write that would clobber a change made since the client
    last read. An agent can therefore retry both creates and updates without a dedup key, but it must read the resource
    first to obtain the token, and it gets a 412 rather than a replayed original response.'
