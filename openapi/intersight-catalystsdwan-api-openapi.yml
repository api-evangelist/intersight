    iam.AppRegistration:
      title: App Registration
      description: 'The AppRegistration object facilitates the registration of OAuth2 client applications, enabling secure access to APIs using OAuth2 credentials.

        #### Purpose

        An AppRegistration defines the metadata and configuration required for OAuth2 client applications to authenticate and obtain access tokens. The metadata defines how a client application retrieves an OAuth2 access token and uses it to invoke the Intersight API on behalf of the AppRegistration. It ensures a secure and controlled mechanism for applications to interact with the system.

        #### Key Concepts

        - **OAuth2 Compliance:** Adheres to OAuth2 standards, supporting various grant types and response types for secure API access.

        - **Client Identification:** Provides unique client IDs and secrets for registered applications, ensuring each client is identifiable and secure.

        - **Redirect URIs:** Specifies the redirection endpoints for OAuth2 flows, ensuring the safe transfer of authorization codes or tokens.

        - **Token Management:** Includes mechanisms for token expiration, revocation, and renewal, maintaining security by managing the lifecycle of access tokens.'
      x-allOf-name: iam.AppRegistration
      allOf:
      - $ref: intersight-system-v3-1.0.11-20260807064027971.json#/components/schemas/mo.BaseMo
      - type: object
        description: Definition of the list of properties defined in 'iam.AppRegistration', excluding properties defined in parent classes.
        required:
        - ClassId
        - ObjectType
        properties:
          ClassId:
            description: 'The fully-qualified name of the instantiated, concrete type.

              This property is used as a discriminator to identify the type of the payload

              when marshaling and unmarshaling data.'
            enum:
            - iam.AppRegistration
            default: iam.AppRegistration
            x-enum-as-string: true
          ObjectType:
            description: 'The fully-qualified name of the instantiated, concrete type.

              The value should be the same as the ''ClassId'' property.'
            enum:
            - iam.AppRegistration
            default: iam.AppRegistration
            x-enum-as-string: true
          AdminStatus:
            description: 'Used to trigger the enable or disable action on the App Registration. These actions change the status of an App Registration.

              * `enable` - Used to enable a disabled API key/App Registration. If the API key/App Registration is already expired, this action has no effect.

              * `disable` - Used to disable an active API key/App Registration. If the API key/App Registration is already expired, this action has no effect.'
            type: string
            enum:
            - enable
            - disable
            default: enable
            x-omitempty: true
          ClientId:
            description: 'A unique identifier for the OAuth2 client application.

              The client ID is auto-generated when the AppRegistration object is created.'
            type: string
            readOnly: true
            x-omitempty: true
          ClientName:
            description: App Registration name specified by user.
            type: string
            x-omitempty: true
          ClientSecret:
            description: 'The OAuth2 client secret.

              The value of this property is generated when grantType includes ''client-credentials''.

              Otherwise, no client-secret is generated.'
            type: string
            x-omitempty: true
          ClientType:
            description: 'The type of the OAuth2 client (public or confidential), as specified in https://tools.ietf.org/html/rfc6749#section-2.1.

              * `public` - Clients incapable of maintaining the confidentiality of their credentials.This includes clients executing on the device used by the resource owner,such as mobile applications, installed native application or a webbrowser-based application.

              * `confidential` - Clients capable of maintaining the confidentiality of their credentials.For example, this could be a client implemented on a secure server withrestricted access to the client credentials.To maintain the confidentiality of the OAuth2 credentials, two use cases areconsidered.1) The application is running as a service within Intersight. The application automatically   obtains the OAuth2 credentials when the application starts and the credentials are not   exposed to the end-user.   Because end-users (even account administrators) do not have access the OAuth2 credentials,   they cannot take the credentials with them when they leave their organization.2) The application is under the control of a "trusted" end-user. For example,   the end-user may create a native application running outside Intersight. The application   uses OAuth2 credentials to interact with the Intersight API. In that case, the Intersight   account administrator may generate OAuth2 credentials with a registered application   using "client_credentials" grant type.   In that case, the end-user is responsible for maintaining the confidentiality of the   OAuth2 credentials. If the end-user leaves the organization, you should revoke the   credentials and issue new Oauth2 credentials.Here is a possible workflow for handling OAuth2 tokens.1) User Alice (Intersight Account Administrator) logins to Intersight and deploys an Intersight   application that requires an OAuth2 token.2) Intersight automatically deploys the application. The application is assigned a OAuth2 token,   possibly linked to Alice. The application must NOT expose the OAuth2 secret to Alice, otherwise   Alice would be able to use the token after she leaves the company.3) The application can make API calls to Intersight using its assigned OAuth2 token. For example,   the application could make weekly scheduled API calls to Intersight.4) Separately, Alice may also get OAuth2 tokens that she can use to make API calls from the   Intersight SDK through the northbound API. In that case, Alice will get the associated OAuth2   secrets, but not the one assigned in step #2.5) Alice leaves the organization. The OAuth2 tokens assigned in step #2 must retain their validity   even after Alice has left the organization. Because the OAuth2 secrets were never shared with   Alice, there is no risk Alice can reuse the OAuth2 secrets.   On the other hand, the OAuth2 tokens assigned in step #4 must be invalidated because Alice had   the OAuth2 tokens in her possession.'
            type: string
            enum:
            - public
            - confidential
            default: public
            x-omitempty: true
          Description:
            description: Description of the application.
            type: string
            x-omitempty: true
          EntityId:
            description: EntityId holds the Id of the client application that is using this AppRegistration.
            type: string
            readOnly: true
            x-omitempty: true
          ExpiryDateTime:
            description: The expiration date of the App Registration which is set at the time of its creation. Its value can only be assigned a date that falls within the range determined by the maximum expiration time configured at the account level. The expiry date can be edited to be earlier or later, provided it stays within the designated expiry period. This period is determined by adding the 'startTime' property of the App Registration to the maximum expiry time configured at the account level.
            type: string
            format: date-time
            x-omitempty: true
          GrantTypes:
            type:
            - array
            - 'null'
            items:
              description: 'The set of grant types that OAuth2 clients can use for this application.

                The grant type is used in the OAuth2 login flow to validate the grant type that has been requested by the client.

                See https://tools.ietf.org/html/rfc7591#page-9 for more details.

                # It is set automatically when AppRegistration is created since currently we do not provide option for the user.

                * `authorization_code` - The ''authorization code'' grant type as defined in the OAuth2 specification.It implies a "response_types" value that includes "code".

                * `refresh_token` - The ''refresh token'' grant type defined in the OAuth2 specification.https://tools.ietf.org/html/rfc7591#section-6.

                * `client_credentials` - The ''client credentials'' grant type defined in the OAuth2 specification.A client can request an access token using only its clientcredentials (or other supported means of authentication) when theclient is requesting access to the protected resources under itscontrol, or those of another resource owner that have been previouslyarranged with the authorization server.https://tools.ietf.org/html/rfc6749#section-4.4.

                * `implicit` - The implicit grant is a simplified authorization code flow optimizedfor clients implemented in a browser using a scripting language suchas JavaScript. In the implicit flow, instead of issuing the clientan authorization code, the client is issued an access token directly(as the result of the resource owner authorization). The grant typeis implicit, as no intermediate credentials (such as an authorizationcode) are issued (and later used to obtain an access token).When issuing an access token during the implicit grant flow, theauthorization server does not authenticate the client.  In somecases, the client identity can be verified via the redirection URIused to deliver the access token to the client.  The access token maybe exposed to the resource owner or other applications with access tothe resource owner''s user-agent.

                * `password` - The resource owner password credentials (i.e., username and password)can be used directly as an authorization grant to obtain an accesstoken.  The credentials should only be used when there is a highdegree of trust between the resource owner and the client (e.g., theclient is part of the device operating system or a highly privilegedapplication), and when other authorization grant types are notavailable (such as an authorization code).

                * `urn:ietf:params:oauth:grant-type:jwt-bearer` - The JWT Bearer Token Grant Type defined in OAuth JWT Bearer Token Profiles [RFC7523].

                * `urn:ietf:params:oauth:grant-type:saml2-bearer` - The SAML 2.0 Bearer Assertion Grant defined in OAuth SAML 2 Bearer Token Profiles [RFC7522].'
              type: string
              enum:
              - authorization_code
              - refresh_token
              - client_credentials
              - implicit
              - password
              - urn:ietf:params:oauth:grant-type:jwt-bearer
              - urn:ietf:params:oauth:grant-type:saml2-bearer
              default: authorization_code
              readOnly: true
              x-omitempty: true
          IsNeverExpiring:
            description: Used to mark the App Registration as a never-expiring App Registration.
            type: boolean
            default: false
            x-omitempty: true
          LastUsedIp:
            description: The ip address from which the App Registration was last used.
            type: string
            readOnly: true
            x-omitempty: true
          LastUsedTime:
            description: The time at which the App Registration was last used. It is updated every 24 hours.
            type: string
            format: date-time
            readOnly: true
            x-omitempty: true
          OperStatus:
            description: 'The current status of the App Registration that dictates the validity of the app.

              * `enabled` - An API key/App Registration having enabled status can be used for API invocation.

              * `disabled` - An API key/App Registration having disabled status cannot be used for API invocation.

              * `expired` - An API key/App Registration having expired status cannot be used for API invocation as the expiration date has passed.'
            type: string
            enum:
            - enabled
            - disabled
            - expired
            default: enabled
            readOnly: true
            x-omitempty: true
          RedirectUris:
            type:
            - array
            - 'null'
            items:
              description: 'After a user successfully authorizes an application, the OAuth2 authorization server will redirect the user back to the

                application with either an authorization code or access token in the URL.

                Registered redirect URLs may contain query string parameters, but must not contain anything in the fragment.

                The registration server rejects the request if a user tries to register a redirect URL that contains a fragment.

                For native and mobile apps, Intersight allows a user to register a URL scheme such as myapp:// which can then be used

                in the redirect URL. The authorization server allows arbitrary URL schemes to be registered in order to support

                registering redirect URLs for native apps.

                Redirect URLs are a critical part of the OAuth flow. After a user successfully authorizes an application,

                the authorization server will redirect the user back to the application with either an authorization code or access

                token in the URL. Because the redirect URL will contain sensitive information, it is critical that the service

                doesn’t redirect the user to arbitrary locations.

                The best way to ensure the user will only be directed to appropriate locations is to require the developer to

                register one or more redirect URLs when they create the application.

                The redirection endpoint URI MUST be an absolute URI.'
              type: string
              pattern: ^$|^(?:[\w.-]+?:\/\/)[\w\.\-\/\d\:]+$
              x-omitempty: true
          RenewClientSecret:
            description: Set value to true to renew the client-secret. Applicable to client_credentials grant type.
            type: boolean
            default: false
            x-omitempty: true
          ResponseTypes:
            type:
            - array
            - 'null'
            items:
              description: 'The set of response types that a OAuth2 client can use.

                This is static list and it is set automatically when AppRegistration is created.

                According to RFC, it is used in OAuth2 login flow to check that this AppRegistration supports response type from the request.

                See https://tools.ietf.org/html/rfc7591#page-9 for more details.

                * `code` - The authorization code response type defined in OAuth2, section 4.1.

                * `token` - The token response type defined in OAuth2, section 4.2.'
              type: string
              enum:
              - code
              - token
              default: code
              readOnly: true
              x-omitempty: true
          RevocationTimestamp:
            description: 'Used to perform revocation for tokens of AppRegistration.

              Updated only internally is case Revoke property come from UI with value true.

              On each request with OAuth2 access token the CreationTime of the OAuth2 token will be compared to RevokationTimestamp of the

              corresponding App Registration.'
            type: string
            format: date-time
            readOnly: true
            x-omitempty: true
          Revoke:
            description: 'Used to trigger update the revocationTimestamp value.

