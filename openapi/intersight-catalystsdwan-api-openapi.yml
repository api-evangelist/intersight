              view and manage storage devices associated with the Kubernetes clusters.  The capability to view and execute

              workflows against the Kubernetes clusters is also granted. It also allows

              the user to run workflows to manage VMs on hypervisor endpoints, and manage connected storage, and creat/view ip pools.

              This role does not include the ability to claim a device.

              You must have a Device Technician, Device Administrator, or an Account Administrator role to claim a device.

              '
