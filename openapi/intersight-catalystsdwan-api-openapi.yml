    asset.Target:
      title: Asset:Target
      description: 'The Target object represents an entity managed by Intersight. It encompasses both physical and software entities, such as UCS servers or cloud accounts, and serves as the cornerstone for target management within Intersight''s ecosystem.

        #### Purpose

        Target serves as the interface for managing entities within Intersight, offering a comprehensive view of the status and capabilities of each managed entity. It supports the establishment of connections, monitoring, and service enablement, facilitating effective management of diverse targets.

        #### Key Concepts

        - **Type and Status Management:** Defines the type of the managed entity and provides insights into its connection and operational status.

        - **Service Integration:** Supports the enablement of services for the target, facilitating comprehensive management and optimization.

        - **Connection and Authentication:** Manages methods for connecting to targets, ensuring secure and reliable interaction between Intersight and the managed entities.

        - **Pre-provisioning Workflow**: Enables a "claim-before-connect" workflow, allowing system targets to be created and configured in anticipation of physical hardware deployment. It allows administrators to prepare the environment for new devices, ensuring that once a physical endpoint is connected, the transition to a fully managed state is secure and efficient. Pre provisioned Targets can complete their claim with by updating the associated asset.PreClaim object with the security token of the connected device.'
