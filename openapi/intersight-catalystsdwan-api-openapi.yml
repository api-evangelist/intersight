components:
  schemas:
    iam.LdapDnsParameters:
      title: Iam:Ldap Dns Parameters
      description: DNS settings used to access LDAP Providers.
      x-allOf-name: iam.LdapDnsParameters
      allOf:
      - $ref: intersight-system-v3-1.0.11-20260807064027971.json#/components/schemas/mo.BaseComplexType
      - type: object
        description: Definition of the list of properties defined in 'iam.LdapDnsParameters', excluding properties defined in parent classes.
        required:
        - ClassId
        - ObjectType
        properties:
          ClassId:
            description: 'The fully-qualified name of the instantiated, concrete type.

              This property is used as a discriminator to identify the type of the payload

              when marshaling and unmarshaling data.'
            enum:
            - iam.LdapDnsParameters
            default: iam.LdapDnsParameters
            x-enum-as-string: true
          ObjectType:
            description: 'The fully-qualified name of the instantiated, concrete type.

              The value should be the same as the ''ClassId'' property.'
            enum:
            - iam.LdapDnsParameters
            default: iam.LdapDnsParameters
            x-enum-as-string: true
          SearchDomain:
            description: Domain name that acts as a source for a DNS query.
            type: string
            pattern: ^$|^(([a-zA-Z0-9])|([a-zA-Z0-9][a-zA-Z0-9\.\-]*[a-zA-Z0-9]))$
            maxLength: 64
            x-omitempty: true
          SearchForest:
            description: Forest name that acts as a source for a DNS query.
            type: string
            pattern: ^$|^(([a-zA-Z0-9])|([a-zA-Z0-9][a-zA-Z0-9\.\-]*[a-zA-Z0-9]))$
            maxLength: 64
            x-omitempty: true
          Source:
            description: 'Source of the domain name used for the DNS SRV request.

              * `Extracted` - The domain name extracted-domain from the login ID.

              * `Configured` - The configured-search domain.

              * `ConfiguredExtracted` - The domain name extracted from the login ID than the configured-search domain.'
            type: string
            enum:
            - Extracted
            - Configured
            - ConfiguredExtracted
            default: Extracted
            x-omitempty: true
    asset.DeviceClaim.Relationship:
      description: A relationship to the 'asset.DeviceClaim' resource, or the expanded 'asset.DeviceClaim' resource, or the 'null' value.
      x-one-of-name: asset.DeviceClaim.Relationship
      oneOf:
      - type: 'null'
      - $ref: intersight-system-v3-1.0.11-20260807064027971.json#/components/schemas/mo.MoRef
      - $ref: '#/components/schemas/asset.DeviceClaim'
      discriminator:
        propertyName: ClassId
    asset.SudiInfo:
      title: Asset:Sudi Info
      description: 'The SUDI is an X.509v3 certificate, which maintains the product identifier and serial number. The identity is implemented at manufacturing and chained to a publicly identifiable root certificate authority. It can be used as an unchangeable identity for configuration, security, auditing, and management. This structure contains the SUDI information read from the device''s Trust Anchor Module (TAM).

        When the Intersight service receives a SUDI signature, it performs the following steps: 1. Validate the SUDI certificate is valid and has been issued by a trusted Certificate Authority. 2. Validate the ''signature''. In DC ApiVersion >= 16, the signature is expected to be a JWT signed by the TAM private key. 3. Set the ''status'' property to indicate whether the signature is valid or not.'
      x-allOf-name: asset.SudiInfo
      allOf:
      - $ref: intersight-system-v3-1.0.11-20260807064027971.json#/components/schemas/mo.BaseComplexType
      - type: object
        description: Definition of the list of properties defined in 'asset.SudiInfo', excluding properties defined in parent classes.
        required:
        - ClassId
        - ObjectType
        properties:
          ClassId:
            description: 'The fully-qualified name of the instantiated, concrete type.

              This property is used as a discriminator to identify the type of the payload

              when marshaling and unmarshaling data.'
            enum:
            - asset.SudiInfo
            default: asset.SudiInfo
            x-enum-as-string: true
          ObjectType:
            description: 'The fully-qualified name of the instantiated, concrete type.

              The value should be the same as the ''ClassId'' property.'
            enum:
            - asset.SudiInfo
            default: asset.SudiInfo
            x-enum-as-string: true
          Jti:
            description: The SUDI challenge jti generated by Intersight. The device reads the current JTI and signs it as part of its SUDI claims and sends to Intersight. Intersight verifies SUDI with the JTI claim. A new JTI is generated after each time a device sends updated SUDI information.
            type: string
            readOnly: true
            x-omitempty: true
          Pid:
            description: The device model (PID) extracted from the X.509 SUDI leaf certificate.
            type: string
            readOnly: true
            x-omitempty: true
          SerialNumber:
            description: The device SerialNumber extracted from the X.509 SUDI leaf certificate.
            type: string
            readOnly: true
            x-omitempty: true
          Signature:
            description: The base64-encoding of a SUDI signature, signed with the provided Trust Anchor Module (TAM) private key and signatureScheme.
            type: string
            readOnly: true
            x-omitempty: true
          Status:
            description: 'The validation status of the device.

              * `DeviceStatusUnknown` - SUDI validation is done on the establishment of a connection. Before a device connects or after it disconnects, the SUDI validation status is set to this value.

              * `Verified` - The SUDI signature and certificate have been validated by the device. The device PID, Serial Number, Status and X.509 certificates were validated by a Trusted Anchor Module. The Intersight services have not cross-validated the SUDI signature.

              * `EndToEndVerified` - The SUDI signature and certificate have been validated by the device and by the Intersight services. The device PID, Serial Number, Status and X.509 certificates were validated by a Trusted Anchor Module.

              * `ChallengeVerified` - The SUDI signature includes a challenge provided by Intersight which has been validated by Intersight. The SUDI signature and certificate have been validated by the device and by the Intersight services. The device PID, Serial Number, Status and X.509 certificates were validated by a Trusted Anchor Module.

              * `CertificateValidationFailed` - Validation of the certificate signing chain failed.

              * `UnsupportedSignatureScheme` - The SUDI signature scheme is not supported.

              * `SignatureValidationFailed` - Validation of the SUDI signature has failed.

              * `UnsupportedFirmware` - The firmware version of the Cisco IMC that is installed does not contain the SUDI APIs needed to perform validation.

              * `UnsupportedHardware` - The device is a model that does not contain a Trust Anchor Module (TAM) and thus cannot be validated.

              * `DeviceError` - The device returned an error when it received a SUDIrequrest request.

              * `DeviceNotResponding` - A request was sent to the device, but no response was received.

              * `InvalidSignatureEncoding` - The encoding of the SUDI signature is invalid.

              * `MissingSignature` - The SUDI signature is missing.

              * `MissingSignatureScheme` - The SUDI signature scheme is missing.

              * `MissingCertificate` - The SUDI certificate is missing.

              * `InvalidCertificateEncoding` - The encoding of the SUDI certificate is invalid.

              * `InvalidIdentity` - The model or serial number of the device is either missing or does not match the certificate attributes.

              * `Suspect` - The DC claims the SUDI has been verified, but there is no way to validate the claim.'
            type: string
            enum:
            - DeviceStatusUnknown
            - Verified
            - EndToEndVerified
            - ChallengeVerified
            - CertificateValidationFailed
            - UnsupportedSignatureScheme
            - SignatureValidationFailed
            - UnsupportedFirmware
            - UnsupportedHardware
            - DeviceError
            - DeviceNotResponding
            - InvalidSignatureEncoding
            - MissingSignature
            - MissingSignatureScheme
            - MissingCertificate
            - InvalidCertificateEncoding
            - InvalidIdentity
            - Suspect
            default: DeviceStatusUnknown
            readOnly: true
            x-omitempty: true
          StatusDetails:
            description: The detailed validation status of the device, such as an error message explaining why the validation failed.
            type: string
            readOnly: true
            x-omitempty: true
          SudiCertificate:
            description: The X.509 SUDI leaf certificate from the Trust Anchor Module. The certificate is serialized in PEM format (Base64 encoded DER certificate).
            $ref: intersight-system-v3-1.0.11-20260807064027971.json#/components/schemas/x509.Certificate
            readOnly: true
            x-omitempty: true
    iam.AccountTags:
      title: Iam:Account Tags
      description: 'An arbitrary key and value pair that can be used to tag REST resources and organize managed objects by

        assigning meta-data tags to any object.'
      x-allOf-name: iam.AccountTags
