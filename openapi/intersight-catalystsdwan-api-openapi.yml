            $ref: '#/components/schemas/iam.LdapBaseProperties'
            x-omitempty: true
          DnsParameters:
            description: Configuration settings to resolve LDAP servers, when DNS is enabled.
            $ref: '#/components/schemas/iam.LdapDnsParameters'
