            PRIVSET.HyperFlex Cluster Administrator: 'As a HyperFlex Cluster Administrator, you can create, edit, deploy, and manage HyperFlex Clusters,

              view all the cluster dashboard widgets, view cluster details, create HyperFlex policies and profiles,

              execute capacity planning, and launch HyperFlex Connect. This role does not include the ability to claim a

