            PRIVSET.API keys: 'Manage API keys used for secure access to system resources and services.

              '
            PRIVSET.API keys and OAuth tokens: 'Manage API keys and OAuth tokens used for secure access to system resources and services.

              '
            PRIVSET.Access and permissions: 'Manage access of users, user groups; and organizations, resource groups, and roles; and IP access management.

              '
            PRIVSET.Access domains: 'Log in and interact with domain settings.

              '
            PRIVSET.Access servers: 'Log in and interact with servers to perform operations based on privileges.

              '
            PRIVSET.Account: 'Manage Intersight account settings.

              '
            PRIVSET.Account Administrator: 'A set of privileges that provides complete access to all services and resources in Intersight.

              '
            PRIVSET.Acknowledge advisories: 'Acknowledge the filed notices, end-of-life and security advisories.

              '
            PRIVSET.Acknowledge alarms: 'Acknowledge the alarms.

              '
            PRIVSET.Activate server profiles: 'Activate the profile on the attached server.

              '
            PRIVSET.Activate webhook: 'As an Activate Webhooks user, you can enable webhooks, allowing them to start receiving and processing notifications and data from the system.

              '
            PRIVSET.Adapter Configuration policies: 'Configure Ethernet and Fibre Channel settings for the Virtual Interface Card (VIC), including features like VXLAN, NVGRE, and TCP Offload settings.

              '
            PRIVSET.Add OS configuration links: 'Upload an OS configuration file for automated and unattended OS installation on servers to improve deployment efficiency.

              '
            PRIVSET.Add OS image links: 'Add the image source of the operating system, specifying the file share location and protocol (CIFS/NFS/HTTPS) to the software repository.

              '
            PRIVSET.Add SCU links: 'Add the Server Configuration Utility (SCU) for automated OS installation, specifying file share locations using NFS, CIFS, or HTTP protocols.

              '
            PRIVSET.Add and remove server profile template tags: 'Assign and manage tags for server profiles.

              '
            PRIVSET.Add domain names: 'Configure and add a domain name to the system for proper network addressing and identification of resources.

              '
            PRIVSET.Add explorations to dashboard: 'Add an exploration to the Intersight dashboard.

              '
            PRIVSET.Add external syslog servers: 'Configure and add external Syslog servers to the system for centralized collection and management of log data from various sources.

              Note: This is a virtual appliance only privilege.

              '
            PRIVSET.Add firmware links: 'Add a firmware source to the software repository by specifying the file share location and protocol (NFS/CIFS/HTTP[S]) for firmware upgrades.

              '
            PRIVSET.Add identity providers: 'Configure and add a new identity provider (IdP) to the system, enabling authentication and access management through external or federated identity services.

              '
            PRIVSET.Add notification rule or webhook: 'Create and configure new notification rules, defining criteria and actions for alerting users based on specific events or conditions.

              '
            PRIVSET.Add trusted IP ranges: 'Add trusted IP ranges.

              '
            PRIVSET.Add trusted certificates: 'Upload and install certificates that are trusted by the system, enabling secure communications and verifying connection authenticity.

              '
            PRIVSET.Alerts: 'Manage the alerts from advisories, and alarms.

              '
            PRIVSET.Allow or Disallow Data Collection: 'Enable and disable proactive RMA, tech support bundle collection, sending additional system information to Cisco.

              '
            PRIVSET.Allow/disallow FI and Unified Edge eCMC CLI launches: 'Enable or disable launch of FI and Unified Edge eCMC CLI.

              '
            PRIVSET.Allow/disallow tech support bundles: 'Enable or disable tech support incident bundle collection.

              '
            PRIVSET.Allow/disallow tunneled vKVM configurations: 'Enable or disable configuration of tunneled vKVM access.

              '
            PRIVSET.Allow/disallow tunneled vKVM launches: 'Enable or disable launch of tunneled vKVM access.

              '
            PRIVSET.Appliance authentication: 'Manage authentication in Intersight appliance using Single sign-on (SSO), Cisco ID, SSL/TLS Certificate and LDAP.

              Note: This is a virtual appliance only privilege.

              '
            PRIVSET.Appliance configuration: 'Manage the configuration settings of the Intersight appliance.

              Note: This is a virtual appliance only privilege.

              '
            PRIVSET.Appliance networking: 'Manage networking settings related to the appliance.

              Note: This is a virtual appliance only privilege.

              '
            PRIVSET.Appliance security & privacy: 'Managing system maintenance and data sharing features related to Proactive RMA feature and option to send supplementary diagnostic and operational data to Cisco.

              Note: This is a virtual appliance only privilege.

              '
            PRIVSET.Apply SSL Certificate: 'As a user with the ability to apply SSL certificates, you can install and configure SSL certificates for secure communications.

              Note: This is a virtual appliance only privilege.

              '
            PRIVSET.Approve Publish Requests: 'Approve Publish Requests

              '
            PRIVSET.Assign chassis profiles: 'Link domain profiles to servers for management.

              '
            PRIVSET.Assign domain profiles: 'Link domain profiles for server management.

              '
            PRIVSET.Assign server profiles: 'Assign a server to the server profile.

              '
            PRIVSET.Attach to and detach from chassis profile templates: 'It allows to attach any policies to server profile and removal of policies from chassis profile.

              '
            PRIVSET.Attach to and detach from domain profile templates: 'It allows to attach any policies to domain profile template and removal of policies from domain profile template.

              '
            PRIVSET.Attach to and detach from server profile templates: 'It allows to attach any policies to server profile and removal of policies from server profile.

              '
            PRIVSET.Audit Log Viewer: 'As an Audit Log Viewer, you can view audit logs.

              '
            PRIVSET.Audit logs: 'Manage and view audit logs.

              '
            PRIVSET.AuditD policies: 'Manage logging of user activities, configuration changes, and operational commands for FIs, leveraging the Linux audit daemon framework (auditd).

              '
            PRIVSET.Authentication: 'Manage authentication methods and policies for securing system access.

              '
            PRIVSET.Authentication settings: 'As a user with access to Authentication settings, you can manage and configure the authentication methods and policies for securing access to the system.

              '
            PRIVSET.Automation Governance: 'As Automation Governor, you can approve or reject approval requests.

              '
            PRIVSET.BIOS policies: 'Set the BIOS policies.

              '
            PRIVSET.Boot Order policies: 'Set the BIOS boot mode, and enable secure boot.

              '
            PRIVSET.Catalog Administrator: 'As a Catalog Administrator, you can create tasks, workflows, custom datatypes, resource selection criteria,

              service items and use these building blocks to create catalog items. You can validate these catalog items

              by deploying them and performing post-deployment operations on the deployed resources. The catalog administrator

              can publish the catalog items to an organization so that these can be consumed by the catalog users in

              that organization.

              '
            PRIVSET.Catalog User: 'As a Catalog User, you can view the catalog items assigned to you, deploy the catalog item, track the

              service requests, view the service item instance that you have created or are assigned to you, and

              perform post-deployment operations on the resource.

              '
            PRIVSET.Certificate Management policies: 'Specify and attach external certificate details to servers, supporting Root CA and IMC certificates.

              '
            PRIVSET.Cisco ID: 'Manage Cisco identification credentials and settings used for accessing Cisco services.

              '
            PRIVSET.Claim Devices: 'Claim devices.

              '
            PRIVSET.Claim targets: 'Assign or register a target to the system for management or monitoring purposes.

              '
            PRIVSET.Clear TPMs: 'Clear the Trusted Platform Module (TPM) on servers.

              '
            PRIVSET.Clear configurations: 'Remove foreign configurations not integrated with current setups.

              '
            PRIVSET.Clear foreign configurations: 'Remove foreign configurations from a server''s storage system to clear external storage setups that are not integrated with the server''s current configuration.

              '
            PRIVSET.Clear system event logs (SEL): 'Erase the system event log (SEL), clearing recorded events.

              '
            PRIVSET.Clusters: 'Manage and configure clusters.

              '
            PRIVSET.Complete Claim: 'As a Complete Claim user you can complete the claim of a previously created Target by

              providing the security token of the device.

              You do not have access to read the status or details of any devices within the account.

