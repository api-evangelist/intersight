        Moid:
          description: The Moid of the referenced REST resource.
          type: string
          x-omitempty: true
        Selector:
          description: 'An OData $filter expression which describes the REST resource to be referenced. This field may

            be set instead of ''moid'' by clients.

            1. If ''moid'' is set this field is ignored.

            1. If ''selector'' is set and ''moid'' is empty/absent from the request, Intersight determines the Moid of the

            resource matching the filter expression and populates it in the MoRef that is part of the object

            instance being inserted/updated to fulfill the REST request.

            An error is returned if the filter matches zero or more than one REST resource.

            An example filter string is: Serial eq ''3AA8B7T11''.'
          type: string
          x-omitempty: true
        link:
          type: string
          description: A URL to an instance of the 'mo.MoRef' class.
    search.SearchItem.Response:
      description: "The response body of a HTTP GET request for the 'search.SearchItem' resource.\nThe value may be one of the following types.\n1. When 'tag' is specified in the URL query, the response schema\n    is a summary of the tag usage.\n1. When '$apply' is specified in the URL query, the response schema\n    is dynamically-generated schema based on the $apply value.\n1. When '$count' is specified in the URL query, the response is\n    a simple object providing the count of the resources.\n1. In all other cases, the response is a list of 'search.SearchItem' resources."
      x-one-of-name: search.SearchItem.Response
      oneOf:
      - $ref: '#/components/schemas/mo.DocumentCount'
      - $ref: '#/components/schemas/search.SearchItem.List'
      - $ref: '#/components/schemas/mo.AggregateTransform'
      - $ref: '#/components/schemas/mo.TagSummary'
      discriminator:
        propertyName: ObjectType
    search.TagItem:
      title: Search:Tag Item
      description: 'The TagItem object serves as an entry point for searching tags associated with Intersight REST resources. It allows users to query and discover tags across the system using OData Query syntax, providing a mechanism for organizing and categorizing resources.

        #### Purpose

        The purpose of a TagItem is to enable efficient discovery and management of tags applied to various Intersight resources. This provides a centralized way to search for specific tags and understand their prevalence and associated values across the system, facilitating resource organization and retrieval based on custom metadata.

        #### Key Concepts

        - **Tag-Based Search:** Specializes in querying resources based on their assigned tags, offering an alternative or supplementary search method to direct resource queries.

        - **Metadata Organization:** Supports the systematic organization and classification of Intersight resources through tagging.'
      x-allOf-name: search.TagItem
      allOf:
      - $ref: '#/components/schemas/mo.BaseMo'
      - type: object
        description: Definition of the list of properties defined in 'search.TagItem', excluding properties defined in parent classes.
        required:
        - ClassId
        - ObjectType
        properties:
          ClassId:
            description: 'The fully-qualified name of the instantiated, concrete type.

              This property is used as a discriminator to identify the type of the payload

              when marshaling and unmarshaling data.'
            enum:
            - search.TagItem
            default: search.TagItem
            x-enum-as-string: true
          ObjectType:
            description: 'The fully-qualified name of the instantiated, concrete type.

              The value should be the same as the ''ClassId'' property.'
            enum:
            - search.TagItem
            default: search.TagItem
            x-enum-as-string: true
          Count:
            description: The number of times this tag key has been set across all resources.
            type: integer
            format: int64
            readOnly: true
            x-omitempty: true
          Key:
            description: Key of the tag from all the resources in Intersight.
            type: string
            readOnly: true
            x-omitempty: true
          Ext_Moid:
            description: The unique identifier of the tag definition managed object. Refer to the comm.TagDefinition API.
            type: string
            readOnly: true
            x-omitempty: true
          TaggedObjectTypes:
            type:
            - array
            - 'null'
            items:
              description: Unique list of object types that have this tag key set.
              type: string
              readOnly: true
              x-omitempty: true
          Type:
            description: Type of the tag definition. Refer to comm.TagDefinitionType API.
            type: string
            readOnly: true
            x-omitempty: true
          Values:
            type:
            - array
            - 'null'
            items:
              description: All values corresponding to the tag key in the results.
              type: string
              readOnly: true
              x-omitempty: true
