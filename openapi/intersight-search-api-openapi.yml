            - mo.VersionContext
            default: mo.VersionContext
            x-enum-as-string: true
          ObjectType:
            description: 'The fully-qualified name of the instantiated, concrete type.

              The value should be the same as the ''ClassId'' property.'
            enum:
            - mo.VersionContext
            default: mo.VersionContext
            x-enum-as-string: true
          InterestedMos:
            type:
            - array
            - 'null'
            items:
              description: 'A collection of objects that have reference to this versioned object.

                The lifecycle of the versioned object is based on the interestedMos list;

                the versioned object will be purged when interestedMos is empty.'
              $ref: '#/components/schemas/mo.MoRef'
              readOnly: true
              x-omitempty: true
