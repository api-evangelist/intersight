      - $ref: '#/components/schemas/mo.TagSummary'
      discriminator:
        propertyName: ObjectType
    DisplayNames:
      type:
      - object
      - 'null'
      description: 'A set of display names for the MO resource. These names are calculated based on other properties of the

        MO and potentially properties of Ancestor MOs. Displaynames are intended as a way to provide a normalized

        user appropriate name for an MO, especially for MOs which do not have a ''Name'' property, which is the case

        for much of the inventory discovered from managed targets.

        There are a limited number of keys, currently ''short'', ''hierarchical'', and ''auditlog''. The value is an array and clients

        should use the first element of the array.'
      readOnly: true
      additionalProperties:
        type: array
        items:
          type: string
