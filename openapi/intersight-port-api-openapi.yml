    equipment.Fru:
      title: Equipment:Fru
      description: 'The equipment.Fru object represents a Field-Replaceable Unit (FRU). It is a special object used to track the history and state changes of hardware components that have been inserted, removed, or replaced.

        #### Purpose

        The primary purpose of the Fru object is to provide an audit trail for hardware maintenance actions. When a component is replaced, the previousFru relationship on the new component''s inventory object will point to a Fru object that contains the vendor, model, and serial number of the old part. It is essential for asset tracking and troubleshooting issues related to hardware changes.

        #### Key Concepts

        - **Hardware Change Tracking:** Records the identity of a component that has been physically replaced or removed.

        - **Action Logging:** The action property specifies what happened to the FRU, with states like Inserted, Removed, or ReplacedWithAlarm.

        - **Historical Data:** Preserves the identity information of the old component, which would otherwise be lost after a replacement.

        - **Alarm Integration:** The ReplacedWithAlarm action is used to trigger alarms when a hardware replacement is detected, prompting administrative review and action.'
      x-allOf-name: equipment.Fru
      allOf:
      - $ref: '#/components/schemas/equipment.Base'
      - type: object
        description: Definition of the list of properties defined in 'equipment.Fru', excluding properties defined in parent classes.
        required:
        - ClassId
        - ObjectType
        properties:
          ClassId:
            description: 'The fully-qualified name of the instantiated, concrete type.

              This property is used as a discriminator to identify the type of the payload

              when marshaling and unmarshaling data.'
            enum:
            - equipment.Fru
            default: equipment.Fru
            x-enum-as-string: true
          ObjectType:
            description: 'The fully-qualified name of the instantiated, concrete type.

              The value should be the same as the ''ClassId'' property.'
            enum:
            - equipment.Fru
            default: equipment.Fru
            x-enum-as-string: true
          Action:
            description: 'This field identifies the action performed on a component.

              * `None` - No action performed on the FRU.

              * `Inserted` - A new FRU is inserted or added.

              * `Removed` - The previous FRU is removed.

              * `Replaced` - The previous FRU is replaced with a new FRU.

              * `ReplacedWithAlarm` - The previous FRU is replaced with a new FRU and a alarm is raised.'
            type: string
            enum:
            - None
            - Inserted
            - Removed
            - Replaced
            - ReplacedWithAlarm
            default: None
            x-omitempty: true
