    console.ConsoleConfig:
      title: Console:Console Config
      description: 'The console.ConsoleConfig object represents the configuration of a terminal console port on a network device. This provides inventory details for the asynchronous serial line settings.

        #### Purpose

        The primary purpose of this object is to provide a read-only inventory of the serial console port''s communication parameters. This includes settings like speed (baud rate), dataBits, stopBits, and parity. This information is crucial for administrators who need to establish a direct serial connection for out-of-band management or troubleshooting.

        #### Key Concepts

        - **Serial Port Inventory:** Captures the complete set of configuration parameters for a device''s console port.

        - **Connectivity Parameters:** Provides the exact settings required for a terminal client to successfully connect to the device.

        - **Read-Only State:** Reflects the current configuration on the device, serving as a source of truth for its console settings.

        - **Device-Specific:** Associated with a specific network element, providing the console configuration for that particular device.'
      x-allOf-name: console.ConsoleConfig
      allOf:
      - $ref: intersight-server-v3-1.0.11-20260807064027971.json#/components/schemas/inventory.Base
      - type: object
        description: Definition of the list of properties defined in 'console.ConsoleConfig', excluding properties defined in parent classes.
        required:
        - ClassId
        - ObjectType
        properties:
          ClassId:
            description: 'The fully-qualified name of the instantiated, concrete type.

              This property is used as a discriminator to identify the type of the payload

              when marshaling and unmarshaling data.'
            enum:
            - console.ConsoleConfig
            default: console.ConsoleConfig
            x-enum-as-string: true
          ObjectType:
            description: 'The fully-qualified name of the instantiated, concrete type.

              The value should be the same as the ''ClassId'' property.'
            enum:
            - console.ConsoleConfig
            default: console.ConsoleConfig
            x-enum-as-string: true
          DataBits:
            description: The databits numbers in console.
            type: integer
            format: int64
            x-omitempty: true
          Parity:
            description: 'The parity bit of the console.

              * `none` - If Parity is none, parity checking is not performed and the parity bit is not transmitted.

              * `odd` - If Parity is odd, the number of mark bits (1s) in the data is counted, and the parity bit is asserted or unasserted to obtain an odd number of mark bits.

              * `even` - If Parity is even, the number of mark bits in the data is counted, and the parity bit is asserted or unasserted to obtain an even number of mark bits.

              * `mark` - If Parity is mark, the parity bit is asserted.

              * `space` - If Parity is space, the parity bit is unasserted.'
            type: string
            enum:
            - none
            - odd
            - even
            - mark
            - space
            default: none
            x-omitempty: true
          Speed:
            description: The speed of the console.
            type: integer
            format: int64
            x-omitempty: true
          StopBits:
            description: The stopbits of async line in console.
            type: integer
            format: int64
            x-omitempty: true
          NetworkElement:
            $ref: '#/components/schemas/network.Element.Relationship'
            description: 'A reference to a networkElement resource.

              When the $expand query parameter is specified, the referenced resource is returned inline.'
            readOnly: true
          RegisteredDevice:
            $ref: intersight-system-v3-1.0.11-20260807064027971.json#/components/schemas/asset.DeviceRegistration.Relationship
            description: 'A reference to a assetDeviceRegistration resource.

              When the $expand query parameter is specified, the referenced resource is returned inline.'
