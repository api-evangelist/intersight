            default: equipment.Sensor
            x-enum-as-string: true
          AlarmStatus:
            description: 'The alarm status of the sensor.

              * `absent` - The sensor is absent on the device.

              * `failed` - The sensor in the device has failed.

              * `normal` - The sensor status is normal.

              * `minor` - The sensor has crossed minor threshold.

              * `major` - The sensor has crossed major threshold.

              * `bad-asic` - The sensor is in bad-asic state.'
