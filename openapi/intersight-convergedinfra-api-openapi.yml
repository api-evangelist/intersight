  schemas:
    convergedinfra.AdapterComplianceDetails:
      title: Convergedinfra:Adapter Compliance Details
      description: "The AdapterComplianceDetails object captures compliance details for adapters within servers of a converged infrastructure pod, focusing on hardware compatibility and firmware status.  \n#### Purpose\nAdapterComplianceDetails provides essential insights into adapter compliance, assessing compatibility with standards and operational criteria necessary for seamless infrastructure operation.   \n#### Key Concepts\n- **Hardware Compatibility:** Evaluates adapter compliance against hardware compatibility lists, ensuring alignment with industry standards. \n- **Firmware and Driver Information:** Includes detailed information about adapter firmware and drivers, supporting thorough compliance checks.\n- **Server Integration:** Associates adapter compliance details with server compliance data, promoting integrated compliance assessments.\n- **Administrative Control:** Accessible through defined privilege sets, ensuring secure and authorized interaction with adapter compliance information."
      x-allOf-name: convergedinfra.AdapterComplianceDetails
      allOf:
      - $ref: '#/components/schemas/convergedinfra.BaseComplianceDetails'
      - type: object
        description: Definition of the list of properties defined in 'convergedinfra.AdapterComplianceDetails', excluding properties defined in parent classes.
        required:
        - ClassId
        - ObjectType
        properties:
          ClassId:
            description: 'The fully-qualified name of the instantiated, concrete type.

              This property is used as a discriminator to identify the type of the payload

              when marshaling and unmarshaling data.'
            enum:
            - convergedinfra.AdapterComplianceDetails
            default: convergedinfra.AdapterComplianceDetails
            x-enum-as-string: true
          ObjectType:
            description: 'The fully-qualified name of the instantiated, concrete type.

              The value should be the same as the ''ClassId'' property.'
            enum:
            - convergedinfra.AdapterComplianceDetails
            default: convergedinfra.AdapterComplianceDetails
            x-enum-as-string: true
          DriverName:
            description: The driver name (e.g. nenic, nfnic) of the adapter.
            type: string
            readOnly: true
            x-omitempty: true
          DriverVersion:
            description: The driver version of the adapter.
            type: string
            readOnly: true
            x-omitempty: true
          Firmware:
            description: The firmware version of the adapter.
            type: string
            readOnly: true
            x-omitempty: true
          HclStatus:
            description: 'The HCL compatibility status for the adapter.

              * `NotEvaluated` - The interoperability compliance for the component has not be checked.

              * `Approved` - The component is valid as per the interoperability compliance check.

              * `NotApproved` - The component is not valid as per the interoperability compliance check.

              * `Incomplete` - The interoperability compliance check could not be completed for the component due to incomplete data.'
            type: string
            enum:
            - NotEvaluated
            - Approved
            - NotApproved
            - Incomplete
            default: NotEvaluated
            readOnly: true
            x-omitempty: true
          HclStatusReason:
            description: 'The reason for the HCL status when it is not Approved.

              * `Missing-Os-Driver-Info` - The validation failed because the given server has no operating system driver information available in the inventory. Either install ucstools vib or use power shell scripts to tag proper operating system information.

              * `Incompatible-Server-With-Component` - The validation failed for this component because he server model and component model combination was not found in the HCL.

              * `Incompatible-Processor` - The validation failed because the given processor was not found for the given server PID.

              * `Incompatible-Os-Info` - The validation failed because the given operating system vendor and version was not found in HCL for the server PID and processor combination.

              * `Incompatible-Component-Model` - The validation failed because the given Component model was not found in the HCL for the given server PID, processor, server Firmware and operating system vendor and version.

              * `Incompatible-Firmware` - The validation failed because the given server firmware or adapter firmware was not found in the HCL for the given server PID, processor, operating system vendor and version and component model.

              * `Incompatible-Driver` - The validation failed because the given driver version was not found in the HCL for the given Server PID, processor, operating system vendor and version, server firmware and component firmware.

              * `Incompatible-Firmware-Driver` - The validation failed because the given component firmware and driver version was not found in the HCL for the given Server PID, processor, operating system vendor and version and server firmware.

              * `Service-Unavailable` - The validation has failed because HCL data service is temporarily not available. The server will be re-evaluated once HCL data service is back online or finished importing new HCL data.

              * `Service-Error` - The validation has failed because the HCL data service has return a service error or unrecognized result.

              * `Unrecognized-Protocol` - The validation has failed for the HCL component because the HCL data service has return a validation reason that is unknown to this service. This reason is used as a default failure reason reason in case we cannot map the error reason received from the HCL data service unto one of the other enum values.

              * `Not-Evaluated` - The validation for the hardware or software HCL status was not yet evaluated because some previous validation had failed. For example if a server''s hardware profile fails to validate with HCL, then the server''s software status will not be evaluated.

              * `Compatible` - The validation has passed for this server PID, processor, operating system vendor and version, component model, component firmware and driver version.'
            type: string
            enum:
            - Missing-Os-Driver-Info
            - Incompatible-Server-With-Component
            - Incompatible-Processor
            - Incompatible-Os-Info
            - Incompatible-Component-Model
            - Incompatible-Firmware
            - Incompatible-Driver
            - Incompatible-Firmware-Driver
            - Service-Unavailable
            - Service-Error
            - Unrecognized-Protocol
            - Not-Evaluated
            - Compatible
            default: Missing-Os-Driver-Info
            readOnly: true
            x-omitempty: true
          Model:
            description: The model information of the adapter.
            type: string
            readOnly: true
            x-omitempty: true
          Adapter:
            $ref: intersight-server-v3-1.0.11-20260807064027971.json#/components/schemas/adapter.Unit.Relationship
            description: 'A reference to a adapterUnit resource.

              When the $expand query parameter is specified, the referenced resource is returned inline.'
            readOnly: true
          ServerComplianceDetails:
            $ref: '#/components/schemas/convergedinfra.ServerComplianceDetails.Relationship'
            description: 'A reference to a convergedinfraServerComplianceDetails resource.

              When the $expand query parameter is specified, the referenced resource is returned inline.'
            readOnly: true
          StorageCompliances:
            description: An array of relationships to convergedinfraStorageComplianceDetails resources.
            type:
            - array
            - 'null'
            items:
              $ref: '#/components/schemas/convergedinfra.StorageComplianceDetails.Relationship'
            readOnly: true
