            PRIVSET.Unassign chassis profiles: 'Remove domain profiles from servers, disconnecting settings.

              '
            PRIVSET.Unassign domain profiles: 'Remove domain profiles, disconnecting server settings.

              '
            PRIVSET.Unassign server profiles: 'Unassign the server from the profile.

              '
            PRIVSET.Unclaim device connector: 'Remove the association of a device connector from its current claim to allow reconfiguration or reassignment to a different system or user.

              Note: This is a virtual appliance only privilege.

              '
            PRIVSET.Unclaim targets: 'Remove a target from the system''s management or monitoring scope.

              '
            PRIVSET.Unified Edge: 'A set of privileges that allows to perform operations related to Unified Edge chassis.

              '
            PRIVSET.Unified Edge Administrator: 'As a Unified Edge Administrator, you can view and manage Switch Profiles and Network Configuration Policies, view Unified Edge dashboard widgets, perform actions on Switch, launch management interfaces and the CLI, create and deploy switch policies and profiles, and manage API keys. This role does not include the ability to claim a device. You must have a Device Technician, Device Administrator, or an Account Administrator role to claim a device.

              '
            PRIVSET.Unified Edge Profiles: 'A set of privileges that allows to manage Unified Edge Profiles, Network and Chassis configuration policies.

              '
            PRIVSET.Unlock and lock front panels: 'Control access to the server''s front panel.

              '
            PRIVSET.Unlock disks: 'Unlock encrypted disks to grant data access.

              '
            PRIVSET.Update reserved licenses: 'Reserve licenses again and generate a new authorization code in Smart Licensing Manager.

              Note: This is a virtual appliance only privilege.

              '
            PRIVSET.Upgrade chassis firmware: 'Update the firmware of a chassis.

              '
            PRIVSET.Upgrade domain firmware: 'Update the firmware for a Domain.

              '
            PRIVSET.Upgrade server firmware: 'Disconnect the server from the network, erase all data, and update inventory records to reflect the change.

              '
            PRIVSET.User Access Administrator: 'As a User Access Administrator, you can add and manage Users and Groups in Intersight, view account details

              and audit logs, manage the IdPs, roles, sessions and API keys for non Account Administrator users.

              However, you cannot claim a device or perform any management tasks in Intersight.

              You cannot add or manage a user with Account Administrator role.

              '
            PRIVSET.VLAN policies: 'Set up network segmentation by defining VLANs specific to organizations.

              '
            PRIVSET.VSAN policies: 'Configure Virtual Storage Area Networks (VSANs) on fabric fibre channel uplinks.

              '
            PRIVSET.Verify domain names: 'Perform checks and validations on domain names to ensure correctness and functionality for network addressing and resource identification.

              '
