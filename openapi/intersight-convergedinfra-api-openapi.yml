            enum:
            - convergedinfra.AdapterComplianceDetails
            - convergedinfra.PodComplianceInfo
            - convergedinfra.ServerComplianceDetails
            - convergedinfra.StorageComplianceDetails
            - convergedinfra.SwitchComplianceDetails
            x-enum-as-string: true
          Name:
            description: The name of the component for which the compliance is evaluated.
            type: string
            readOnly: true
            x-omitempty: true
          Reason:
            description: 'Reason for the status, when the status is Incomplete or NotApproved. Reason should help to identify the component that is not compliant.

              * `NotEvaluated` - The validation for the HCL or Interop status is yet to be performed.

              * `Missing-Os-Info` - This means the Interop status for the sever cannot be computed because we have missing OS information. Either install ucstools vib or use power shell scripts to tag proper OS information.

              * `Incompatible-Storage-Os` - The validation failed because the given storage name and version combination is not found in Interop matrix.

              * `Incompatible-Os-Info` - The validation failed because the given OS name and version combination is not found in HCL.

              * `Incompatible-Processor` - The validation failed because the given processor is not found for the given server PID in HCL.

              * `Incompatible-Server-Platform` - The validation failed because the given server platform is not found in the Interop matrix.

              * `Incompatible-Server-Model` - The validation failed because the given server model is not found in the Interop matrix.

              * `Incompatible-Adapter-Model` - The validation failed because the given adapter model is not found in the Interop matrix.

              * `Incompatible-Switch-Model` - The validation failed because the given switch model is not found in the Interop matrix.

              * `Incompatible-Server-Firmware` - The validation failed because the given server firmware version is not found in HCL.

              * `Incompatible-Switch-Firmware` - The validation failed because the given switch firmware version is not found in Interop matrix.

              * `Incompatible-Firmware` - The validation failed because the given adapter firmware version is not found in either HCL or Interop matrix.

              * `Incompatible-Driver` - The validation failed because the given driver version is not found in either HCL or Interop matrix.

              * `Incompatible-Firmware-Driver` - The validation failed because the given adapter firmware and driver version is not found in either HCL or Interop matrix.

              * `Missing-Os-Driver-Info` - The validation failed because the given server has no OS driver information available in the inventory. Either install ucstools vib or use power shell scripts to tag proper OS information.

              * `Missing-Os-Or-Driver-Info` - This means the Interop status for the switch or storage array cannot be computed because we have either missing Host OS information or missing required driver information. Either install ucstools vib or use power shell scripts to tag proper OS information or install required drivers.

              * `Incompatible-Components` - The validation failed for the given server because one or more of its components failed validation.

              * `Compatible` - This means the HCL status and Interop status for the component have passed all validations for all of its related components.'
            type: string
            enum:
            - NotEvaluated
            - Missing-Os-Info
            - Incompatible-Storage-Os
            - Incompatible-Os-Info
            - Incompatible-Processor
            - Incompatible-Server-Platform
            - Incompatible-Server-Model
            - Incompatible-Adapter-Model
            - Incompatible-Switch-Model
            - Incompatible-Server-Firmware
            - Incompatible-Switch-Firmware
            - Incompatible-Firmware
            - Incompatible-Driver
            - Incompatible-Firmware-Driver
            - Missing-Os-Driver-Info
            - Missing-Os-Or-Driver-Info
            - Incompatible-Components
            - Compatible
            default: NotEvaluated
            readOnly: true
            x-omitempty: true
          Status:
            description: 'Compliance status for the component.

              * `NotEvaluated` - The interoperability compliance for the component has not be checked.

              * `Approved` - The component is valid as per the interoperability compliance check.

              * `NotApproved` - The component is not valid as per the interoperability compliance check.

              * `Incomplete` - The interoperability compliance check could not be completed for the component due to incomplete data.'
            type: string
            enum:
            - NotEvaluated
            - Approved
            - NotApproved
            - Incomplete
            default: NotEvaluated
            readOnly: true
            x-omitempty: true
