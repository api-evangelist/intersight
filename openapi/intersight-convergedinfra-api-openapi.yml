              view workflow executions.

              '
            ROLE.Workload Administrator: 'As a Workload Administrator you can view and manage Workload Definitions and Workload Deployments.

              '
            ROLE.Workload Operator: 'As a Workload Operator you can view and manage Workload Deployments and view Workload Definitions.

              '
            ROLE.Workload Optimizer Administrator: "As a Workload Optimizer Administrator, you can access all Workload Optimizer features and perform \nadministrative tasks to configure Workload Optimizer.\n"
            ROLE.Workload Optimizer Advisor: 'As a Workload Optimizer Advisor, you can view workload optimization state and recommended actions,

