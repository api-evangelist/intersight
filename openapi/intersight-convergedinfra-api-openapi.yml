              Note: This is a virtual appliance only privilege.

              '
            PRIVSET.Configure IP pools: 'Manages the collection of IP addresses that can be dynamically assigned to services running on network elements. It supports both IPv4 and IPv6 addresses and can be configured at either the pool level or block level.

              '
            PRIVSET.Configure IQN pools: 'Define and manage iSCSI Qualified Names (IQNs) pools for organized iSCSI identifier assignment.

              '
            PRIVSET.Configure LDAP servers: 'Set up and manage LDAP server settings, including server address, port, authentication methods, and directory structures to enable directory services and authentication.

              Note: This is a virtual appliance only privilege.

              '
            PRIVSET.Configure Local Users Password Policy: 'Set up and manage the password policy for local users, including requirements for password complexity, expiration, and reset procedures to ensure secure access control.

              Note: This is a virtual appliance only privilege.

              '
            PRIVSET.Configure MAC pools: 'Manage the collection of MAC addresses that are unique in their Layer 2 environment, used to assign to vNICs on a server. This helps in automating the assignment of MAC addresses in server profiles.

