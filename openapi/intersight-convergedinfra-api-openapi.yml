            PRIVSET.View sessions: 'View and terminate active vKVM, Tunneled vKVM, and VMRC console sessions launched from Intersight, and view session history.

              '
            PRIVSET.View virtual machine templates: 'Manage and configure virtual machine (VM) templates.

              '
            PRIVSET.Virtual KVM policies: 'Attach/detach Virtual KVM policies.

              '
            PRIVSET.Virtual Media policies: 'Enable the virtual media service on the endpoint, encryption of all communications and low power USB.

              '
            PRIVSET.Virtual appliance licensing: 'Manage the licensing for virtual appliance (VA). Learn more, Introduction to Licensing.

              Note: This is a virtual appliance only privilege.

              '
            PRIVSET.Virtual machines: 'Manage and configure virtual machines (VMs).

              '
            PRIVSET.Virtualization Administrator: 'As a Virtualization Administrator, a user can view and manage hypervisor resources, view

              and execute workflows.


              This privilege does not include the ability to claim a device. You must have a

              Device Technician, Device Administrator, or an Account Administrator role to claim a device.

              '
            PRIVSET.Virtualization hosts: 'Manage and configure virtualization hosts.

              '
            PRIVSET.Withdraw Approvals: 'Withdraw Approvals

              '
            PRIVSET.Workflow Designer: 'As a Workflow Designer, you can define workflow definitions and custom data types,

              view workflow definitions, task definitions and custom data types, execute workflows and

              view workflow executions.

              '
            PRIVSET.Workload Administrator: "As a Workload Administrator, you can define workload definitions using Blueprints and underlying ServiceItems \nand workflow definitions. You can also define workload deployments using Workload Definitions and deploy workloads \nto target devices.\n"
            PRIVSET.Workload Designer: "As a Workload Designer, you can define workload definitions using Blueprints and underlying ServiceItems \nand workflow definitions. \n"
            PRIVSET.Workload Operator: "As a Workload Operator, you can define workload deployments using Workload Definitions and deploy workloads \nto target devices.\n"
            PRIVSET.Workload Optimizer Administrator: "As a Workload Optimizer Administrator, you can access all Workload Optimizer features and perform \nadministrative tasks to configure Workload Optimizer.\n"
            PRIVSET.Workload Optimizer Advisor: 'As a Workload Optimizer Advisor, you can view workload optimization state and recommended actions,

              run plans for workload optimization.

              '
            PRIVSET.Workload Optimizer Automator: 'As a Workload Optimizer Automator, you can view workload optimization state, recommended actions,

              run plans for workload optimization, execute workload optimization actions, and deploy workloads.

              '
            PRIVSET.Workload Optimizer Deployer: "As a Workload Optimizer Deployer, you can view all Workload Optimizer charts and data, deploy \nworkloads, and create policies and templates. You cannot run plans or execute any recommended actions.\n"
            PRIVSET.Workload Optimizer Observer: 'As a Workload Optimizer Observer, you can view workload optimization state and recommended actions.

              '
            PRIVSET.iSCSI Adapter policies: 'Configure settings for iSCSI traffic management, including TCP Connection Timeout, DHCP Timeout, and Retry Count for busy LUN IDs, optimizing iSCSI boot configurations.

              '
            PRIVSET.iSCSI Boot policies: 'Configure settings required to enable a server to boot from an iSCSI-based storage device.

              '
            PRIVSET.iSCSI Static Target policies: 'Define static iSCSI target configuration settings for servers that need to connect to specific storage devices over the iSCSI protocol.

              '
            PRIVSET.vKVM Only: 'As a vKVM-only user, you can launch vKVM and tunneled vKVM sessions to a server from Intersight. In addition you can view servers, chassis and the running workflows. In this role, you cannot perform any server actions from Intersight apart from launching vKVM.

              '
