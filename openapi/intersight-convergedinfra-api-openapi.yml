            PRIVSET.Configure: "Configure physical servers, chassis, and domains along with their respective profiles and templates, \nwhile managing compute, management, network, and storage policies, and configuring pools of Intersight Infrastructure Services.\n"
            PRIVSET.Configure Cisco software download credentials: 'Set up and manage credentials required for accessing and downloading Cisco software to ensure secure and authorized access to updates and resources.Set up and manage credentials required for accessing and downloading Cisco software to ensure secure and authorized access to updates and resources.

              '
