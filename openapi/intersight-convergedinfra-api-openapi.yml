            description: The Cisco IMC firmware version of the server.
            type: string
            readOnly: true
            x-omitempty: true
          HclStatus:
            description: 'The HCL compatibility status of the server.

              * `NotEvaluated` - The interoperability compliance for the component has not be checked.

              * `Approved` - The component is valid as per the interoperability compliance check.

              * `NotApproved` - The component is not valid as per the interoperability compliance check.

              * `Incomplete` - The interoperability compliance check could not be completed for the component due to incomplete data.'
            type: string
            enum:
            - NotEvaluated
            - Approved
            - NotApproved
            - Incomplete
            default: NotEvaluated
            readOnly: true
            x-omitempty: true
          HclStatusReason:
            description: 'The reason for server''s HCL status.

              * `Missing-Os-Driver-Info` - The validation failed because the given server has no operating system driver information available in the inventory. Either install UCS Tools VIB on the host ESXi or use OS Discovery Tool scripts to provide proper operating system information.

              * `Incompatible-Server` - The validation failed for this server because the server''s model was not listed in the HCL.

              * `Incompatible-Processor` - The validation failed because the given processor was not listed for the given server model.

              * `Incompatible-Os-Info` - The validation failed because the given operating system vendor or version was not listed in HCL for the server PID and processor combination.

              * `Incompatible-Firmware` - The validation failed because the given server firmware was not listed in the HCL for the given server PID, processor, operating system vendor and version.

              * `Service-Unavailable` - The validation has failed because HCL data service is temporarily not available. The server will be re-evaluated once HCL data service is back online or finished importing new HCL data.

              * `Service-Error` - The validation has failed because the HCL data service has returned a service error or unrecognized result.

              * `Not-Evaluated` - This means the HclStatus for the server has not been evaluated because it is exempted.

              * `Incompatible-Components` - The validation has failed for this server because one or more components have "Not-Listed" status.

              * `Compatible` - The validation has passed for this server''s model, processor, operating system vendor and version.'
            type: string
            enum:
            - Missing-Os-Driver-Info
            - Incompatible-Server
            - Incompatible-Processor
            - Incompatible-Os-Info
