            PRIVSET.Catalog Administrator: 'As a Catalog Administrator, you can create tasks, workflows, custom datatypes, resource selection criteria,

              service items and use these building blocks to create catalog items. You can validate these catalog items

              by deploying them and performing post-deployment operations on the deployed resources. The catalog administrator

              can publish the catalog items to an organization so that these can be consumed by the catalog users in

              that organization.

              '
            PRIVSET.Catalog User: 'As a Catalog User, you can view the catalog items assigned to you, deploy the catalog item, track the

              service requests, view the service item instance that you have created or are assigned to you, and

              perform post-deployment operations on the resource.

              '
